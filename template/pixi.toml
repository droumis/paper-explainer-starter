[workspace]
name = "paper-explainer"
version = "0.1.0"
description = "Interactive visual guide to a research paper"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Every task takes an optional project directory as its first argument, needed
# only when the repo holds several papers:
#     pixi run probe                    the single project here
#     pixi run probe andermann-2011     that project
[tasks]
init = "python scripts/papers.py init"
update = "python scripts/papers.py update"
papers = "python scripts/papers.py list"
new-paper = "python scripts/papers.py new"
sync-assets = "python scripts/papers.py sync-assets"
serve = "python scripts/papers.py serve"
build = "python scripts/papers.py build"
index = "python scripts/papers.py index"
probe = "python scripts/probe_pdf.py"
extract-figures = "python scripts/extract_figures.py"
verify-figures = "python scripts/extract_figures.py --verify"
check-refs = "python scripts/extract_figures.py --check-refs"
check-site = "python scripts/check_site.py"
playwright = "playwright"

[dependencies]
python = ">=3.11"
mkdocs = ">=1.5"
mkdocs-material = ">=9.0"
pymupdf = ">=1.23"
pillow = ">=10.0"
numpy = ">=1.26"
matplotlib = ">=3.8"

[pypi-dependencies]
playwright = ">=1.62.0, <2"
