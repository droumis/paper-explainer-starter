# CI for a paper explainer project. Copied in with the rest of the template.
#
# Every step here corresponds to something that has shipped broken: a caption
# describing panels the crop cut off, a figure file nothing referenced, a
# diagram whose scale went NaN, a page with a silent console error.
#
# Works for both layouts. One paper per repo puts mkdocs.yml at the root; a repo
# holding several papers puts one per subdirectory, and every step then loops.
#
# The paper PDF is usually not redistributable, so figure steps run only where a
# PDF is present. Commit-free CI still checks syntax, the build, and the site.
name: CI

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A repo whose root manifest is untracked checks out without one, and
      # setup-pixi then warns, silently falls back, and fails later somewhere
      # confusing. These are the entry points every task needs, so say so here.
      - name: Checkout is self-sufficient
        run: |
          missing=
          for f in pixi.toml pixi.lock scripts; do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not in this checkout:$missing. These are the repo's"\
                 "entry points, not build output. A .gitignore inherited from the"\
                 "starter anchors /pixi.toml, /pixi.lock and /scripts; run"\
                 "\`pixi run update\` to replace it, then commit the three paths."
            exit 1
          fi

      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # One list of paper directories, used by every step below, so a new paper
      # cannot be silently left out of CI.
      - name: Find paper projects
        id: papers
        run: |
          if [ -f mkdocs.yml ]; then
            papers="."
          else
            papers=$(find . -mindepth 2 -maxdepth 2 -name mkdocs.yml \
                       -not -path './template/*' -printf '%h\n' | sed 's|^\./||' | sort)
          fi
          if [ -z "$papers" ]; then
            echo "::error::No mkdocs.yml found at the root or one level down"
            exit 1
          fi
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$papers" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "papers:"; echo "$papers"

      - name: JavaScript syntax
        run: |
          for p in ${{ steps.papers.outputs.list }}; do
            for f in "$p"/docs/assets/js/*.js "$p"/docs/assets/js/lib/*.js; do
              [ -e "$f" ] && node --check "$f"
            done
          done

      - name: Python syntax
        run: |
          for f in scripts/*.py; do
            python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      - name: Prose conventions
        run: |
          for p in ${{ steps.papers.outputs.list }}; do
            # Em dashes are held at zero. Commas, colons, periods, parentheses.
            if grep -rn "—" "$p"/docs/*.md; then
              echo "::error::em dashes found in $p; use commas, colons, periods or parentheses"
              exit 1
            fi
            # "not just X but Y" states the contrast instead of the point.
            if grep -rniE "not just .{1,40} but " "$p"/docs/*.md; then
              echo "::error::binary contrast found in $p; state the positive claim directly"
              exit 1
            fi
          done

      - name: Figure crops verify
        run: |
          for p in ${{ steps.papers.outputs.list }}; do
            if ls "$p"/*.pdf >/dev/null 2>&1; then
              pixi run verify-figures "$p"
              pixi run check-refs "$p"
            else
              echo "No PDF in $p, skipping figure checks."
            fi
          done

      - name: Build
        run: |
          for p in ${{ steps.papers.outputs.list }}; do
            pixi run build "$p" 2>&1 | tee build.log
            if grep -q WARNING build.log; then
              echo "::error::$p built with warnings"
              grep WARNING build.log
              exit 1
            fi
          done

      - name: Browser check
        run: |
          pixi run playwright install --with-deps chromium
          # A port per paper, rather than stopping each server: `pixi run serve`
          # execs mkdocs, so killing the job's child does not reliably stop it,
          # and a stale server on the port would silently check the wrong site.
          port=8000
          for p in ${{ steps.papers.outputs.list }}; do
            pixi run serve "$p" -a "127.0.0.1:$port" &
            for i in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$port/" >/dev/null && break
              sleep 1
            done
            pixi run check-site "$p" --port "$port"
            port=$((port + 1))
          done
