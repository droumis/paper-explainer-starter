        - article [ref=e91]:
          - heading "The GLM Analysis" [level=1] [ref=e92]
          - paragraph [ref=e93]:
            - text: "The pairwise correlations showed that individual CA1-PFC pairs are coordinated during SWRs: specific CA1 neurons are linked to specific PFC neurons. But the brain doesn't work in pairs. During any given ripple, dozens of CA1 place cells fire together. The authors used a"
            - strong [ref=e94]: generalized linear model (GLM)
            - text: "to ask: can we predict a PFC neuron's spiking during a SWR from the simultaneous activity of the"
            - emphasis [ref=e95]: entire
            - text: CA1 ensemble?
          - heading "What is a GLM?" [level=2] [ref=e96]
          - paragraph [ref=e97]:
            - text: Start with what a
            - strong [ref=e98]: regression
            - text: "does: it predicts one number from a set of other numbers by finding a weighted sum of them. Here, the number we predict is"
            - strong [ref=e99]: how many spikes a PFC neuron fires during a SWR
            - text: (0, 1, 2, 3, ...). The numbers we predict it from are
            - strong [ref=e100]: how many spikes each CA1 neuron fires in the same 200 ms window
            - text: .
