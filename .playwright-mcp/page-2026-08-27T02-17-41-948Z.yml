            - text: ", the"
            - emphasis [ref=e216]: expected
            - text: number of PFC spikes for this ripple, from the CA1 spike counts.
          - generic [ref=e217]:
            - paragraph [ref=e218]: λ is a rate, not a count
            - paragraph [ref=e219]:
              - generic [ref=e221]:
                - generic [ref=e222]: λ
                - math [ref=e226]:
                  - generic [ref=e227]: λ
              - text: is an average and can be any positive number, like 1.35 spikes. An actual observed count is always a whole number. The model predicts 1.35; the neuron fires 1 spike this ripple and 2 the next. Those aren't contradictions; 1.35 is the rate the counts vary around.
