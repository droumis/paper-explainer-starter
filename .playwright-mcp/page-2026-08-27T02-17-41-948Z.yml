          - paragraph [ref=e186]: The linear predictor is the weighted sum we just described. The other two choices are what the next sections settle.
          - heading "Why not ordinary linear regression?" [level=2] [ref=e187]
          - paragraph [ref=e188]: Spike counts break the assumptions of ordinary least-squares regression in three ways.
          - paragraph [ref=e189]:
            - strong [ref=e190]: They can't be negative.
            - text: A straight line fit to spike counts will eventually predict −0.4 spikes for some combination of inputs, which is meaningless.
          - paragraph [ref=e191]:
            - strong [ref=e192]: They're whole numbers, and mostly small.
            - text: In a 200 ms ripple window a PFC neuron usually fires 0, 1, or 2 spikes. The outcome isn't a smooth continuum; it's a handful of discrete possibilities dominated by zero.
          - paragraph [ref=e193]:
            - strong [ref=e194]: Their variability grows with their average.
            - text: This is the subtle one and it matters most. A neuron averaging 0.1 spikes per ripple is nearly always silent, with very little spread. A neuron averaging 8 spikes per ripple will range roughly 4 to 12, much more spread. Ordinary regression assumes the scatter around the prediction is the
            - emphasis [ref=e195]: same size
            - text: everywhere, so it would treat both cases identically and misjudge how surprising any given deviation is.
          - paragraph [ref=e196]:
            - text: The standard distribution with exactly these properties is the
            - strong [ref=e197]: Poisson distribution
            - text: ": it describes counts of events that occur independently at some average rate, it produces only non-negative whole numbers, and its variance"
            - emphasis [ref=e198]: equals
            - text: its mean, so spread automatically grows with the average, matching what neurons do. It has a single parameter, written
            - generic [ref=e200]:
              - generic [ref=e201]: λ
              - math [ref=e205]:
                - generic [ref=e206]: λ
            - text: (lambda), which is that average rate.
          - paragraph [ref=e207]:
            - text: So the GLM's job is to predict
            - generic [ref=e209]:
