          - paragraph [ref=e885]:
            - text: The principle is
            - strong [ref=e886]: maximum likelihood
            - text: ": pick the coefficients that make the spike counts we actually recorded as probable as possible. For any candidate set of βs, the Poisson distribution gives the probability of each ripple's observed count, and multiplying those together scores that candidate. Fitting means finding the best-scoring set."
          - paragraph [ref=e887]: "Ordinary least squares reaches its answer with one formula. A Poisson GLM can't, because the coefficients sit inside an exponential, so the best set has to be searched for: guess, see how far off the predictions are, adjust, repeat. It settles after five to seven passes."
          - paragraph [ref=e888]:
            - text: The search can also
            - strong [ref=e889]: fail to converge
            - text: ", wandering without ever settling. That matters here because the authors discarded every PFC neuron whose GLM failed to converge, which they attribute largely to insufficient data."
          - group [ref=e890]:
            - generic "How the search actually works, step by step" [ref=e891] [cursor=pointer]
            - text: e β y − μ μ = 3 − 2 2 = 0 . 5 z = η + ( y − μ ) / μ l o g 1 . 5 = 0 . 4 1 z l o g 0 z η − 1 z w = μ
          - heading "Does it actually predict? Cross-validation" [level=3] [ref=e892]
          - paragraph [ref=e893]:
            - text: Fitting a model to data and then testing it on the same data is circular. With enough predictors you can "explain" noise, a failure called
            - strong [ref=e894]: overfitting
            - text: ": the model memorizes the specific events it was trained on and predicts new ones badly. The only honest test is on data the model never saw."
          - paragraph [ref=e895]: "The authors' procedure:"
          - list [ref=e896]:
            - listitem [ref=e897]: Pick a random 90% of the SWRs and fit the GLM on those.
            - listitem [ref=e898]: Use the resulting coefficients to predict PFC spike counts for the held-out 10%.
            - listitem [ref=e899]:
              - text: Measure the
              - strong [ref=e900]: prediction error
              - text: ": the average absolute difference between predicted and actual spike counts on those held-out SWRs."
            - listitem [ref=e901]:
              - text: Repeat from step 1 with a fresh random split,
              - strong [ref=e902]: 5000 times
              - text: in all.
          - paragraph [ref=e903]:
            - text: An error of "some fraction of a spike" means nothing on its own. It needs a baseline for comparison. The authors built one by
            - strong [ref=e904]: shuffling
            - text: ": take the same predictions and scramble which SWR each one belongs to, then re-measure the error. This destroys the pairing between a ripple's CA1 activity and its PFC response while leaving both sets of numbers otherwise untouched. A model that had learned nothing real would do no worse under shuffling."
          - paragraph [ref=e905]:
            - strong [ref=e906]: Percent improvement over shuffled
            - text: ", the axis in Figure 6E below, is how much lower the real prediction error is than the shuffled one. Zero means the model does no better than chance; larger means the CA1 ensemble carries genuine information about that PFC neuron's response."
          - heading "The real results" [level=2] [ref=e907]
          - generic [ref=e908]:
            - img "GLM network for a PFC cell, and prediction accuracy versus CA1 ensemble size" [ref=e909]
            - generic [ref=e910]:
              - strong [ref=e911]: Figure 6D–E from Jadhav et al. 2016.
              - text: "(D, left) A GLM fitted for one PFC cell and one simultaneously recorded CA1 ensemble. Each edge is a β coefficient: magenta for significant positive, dark green for significant negative, faint grey for not significant. The single PFC cell on the right receives both signs at once. (D, right) The same model embedded in the larger network of all PFC cells recorded at the same time: red dots are SWR-excited cells, blue SWR-inhibited, cyan unmodulated. (E) Cross-validated prediction, as percent improvement over shuffled data, plotted against CA1 ensemble size. Striped bars are models trained on SWR activity; white bars are trained on activity during movement, which the panel's legend labels “Theta-trained” because those periods are defined by running with theta present. Both improve with ensemble size (one-way ANOVA on ensemble-size group, p < 10⁻⁴ and p < 10⁻⁷ respectively). On the vertical scale, the largest ensembles reach about 6% improvement and the smallest barely clear 1%. Error bars are SEM."
          - paragraph [ref=e912]: "The GLM confirmed three things:"
          - paragraph [ref=e913]:
            - strong [ref=e914]: 1. CA1 ensembles predict PFC spiking during SWRs.
            - text: Across 77 SWR-modulated PFC cells, cross-validated prediction beat the shuffled baseline. It worked about equally well for SWR-excited and SWR-inhibited neurons (p = 0.29 for the difference), and better for SWR-modulated cells than for unmodulated ones.
          - paragraph [ref=e915]:
            - strong [ref=e916]: 2. The same PFC neuron can be positively predicted by one CA1 neuron and negatively predicted by another.
            - text: "The reverse holds too: one CA1 neuron can positively predict one PFC cell and negatively predict a different one. That is the structured pattern: coordination is specific to particular pairs rather than a blanket effect. (What"
            - emphasis [ref=e917]: explains
            - text: the signs is taken up on the next page but comes from a separate analysis, not from the GLM coefficients.)
          - paragraph [ref=e918]:
            - strong [ref=e919]: 3. Prediction improves with ensemble size.
            - text: More CA1 neurons in the model → better predictions. This means the population carries distributed information about PFC state, spread across many cells rather than concentrated in one or two strong pairs.
          - heading "The ensemble size effect" [level=3] [ref=e920]
          - paragraph [ref=e921]:
            - text: "Panel E above is the quantitative version: prediction improves as the CA1 ensemble grows, from about 1% for the smallest ensembles to about 6% for the largest, and the same holds for models trained on movement periods. The"
            - link "next page" [ref=e922] [cursor=pointer]:
              - /url: ../pipeline/
            - text: reruns that whole sweep on simulated data so you can watch the bars being computed.
          - heading "What the GLM does and doesn't show" [level=2] [ref=e923]
          - paragraph [ref=e924]: "The GLM extends beyond pairwise correlations. It shows that a CA1 population as a whole carries information about a PFC neuron's response to a ripple, and that the information is specific: each PFC neuron sits at the intersection of positive and negative coefficients from different CA1 cells. Larger ensembles predict better, so that information is spread across the population rather than concentrated in one or two strong pairs."
          - paragraph [ref=e925]:
            - text: This is the evidence for
            - strong [ref=e926]: structured reactivation
            - text: ": a specific pattern of population co-activity that maps onto behavioural experience."
          - generic [ref=e927]:
            - paragraph [ref=e928]: Prediction is not causation
            - paragraph [ref=e929]:
              - text: It's tempting to read this as "CA1 drives PFC," but a GLM cannot establish that. The model relates spike counts measured in the
              - emphasis [ref=e930]: same
              - text: "200 ms window, and a correlation in one window says nothing about which came first. The direction is also a modeling choice, not a result: the authors ran the model in reverse too, predicting a CA1 neuron's spiking from the simultaneously recorded PFC ensemble, and it works in that direction as well."
            - paragraph [ref=e931]:
              - text: What
              - emphasis [ref=e932]: does
              - text: "speak to direction is timing, covered on the previous page: CA1 activity peaks around 54 ms after ripple onset and PFC responses follow at roughly 84–100 ms. Combined with the anatomy (hippocampal projections reach PFC by both direct and indirect routes, though the direct projection from dorsal CA1 is a minor one), a hippocampus-to-PFC influence is the plausible reading. But the GLM's own contribution is to establish that the coordination is"
              - emphasis [ref=e933]: structured and content-specific
              - text: ", not to establish its direction."
